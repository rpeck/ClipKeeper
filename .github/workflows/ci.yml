# Runs on every pull request and on pushes to main. Uses no event inputs in
# run steps, so there is nothing for an untrusted title or body to inject.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build, test, lint, audit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test -c release -Xswiftc -enable-testing

      - name: Lint
        run: |
          brew install swiftlint
          swiftlint lint --strict --reporter github-actions-logging

      - name: Audit dependencies
        run: scripts/audit-deps.sh
