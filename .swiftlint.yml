# SwiftLint configuration. CI runs `swiftlint lint --strict`, so every
# warning fails the build. Keep the rule set modest: the goal is to catch
# real mistakes, not to argue about style.
included:
  - ClipKeeper
  - ClipKeeperTests
excluded:
  - .build
  - build
  - ClipKeeper.xcodeproj

disabled_rules:
  - line_length            # long regex and SQL lines are deliberate
  - identifier_name        # short names such as `db`, `x`, `w` are fine
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity  # the classifiers are big switch statements by design
  - trailing_comma
  - todo
  - nesting
  - large_tuple

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - first_where
  - last_where
  - redundant_nil_coalescing
  - unused_optional_binding
  - vertical_whitespace_closing_braces
  - force_unwrapping

force_cast: warning
force_try: warning
force_unwrapping: warning
