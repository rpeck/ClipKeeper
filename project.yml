name: ClipKeeper
options:
  bundleIdPrefix: com.raymondpeck
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "26.3"

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: 2.3.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    minVersion: 1.10.0
    maxVersion: 1.16.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Manual
    # A stable identity keeps the Accessibility permission across rebuilds.
    # scripts/make-dev-cert.sh creates this one. Use "-" for ad-hoc signing,
    # or "Apple Development" with a DEVELOPMENT_TEAM for a real certificate.
    CODE_SIGN_IDENTITY: "ClipKeeper Development"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: false
    DEAD_CODE_STRIPPING: true

targets:
  ClipKeeper:
    type: application
    platform: macOS
    sources:
      - path: ClipKeeper
        excludes:
          - "Info.plist"
      - path: docs/USER-GUIDE.md
        buildPhase: resources
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: Highlightr
        product: Highlightr
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: GRDB
        product: GRDB
    info:
      path: ClipKeeper/Info.plist
      properties:
        CFBundleName: ClipKeeper
        CFBundleDisplayName: ClipKeeper
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Copyright © 2026 Raymond Peck.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raymondpeck.ClipKeeper
        PRODUCT_NAME: ClipKeeper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ClipKeeper/Info.plist

  ClipKeeperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClipKeeperTests
    dependencies:
      - target: ClipKeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raymondpeck.ClipKeeperTests
        GENERATE_INFOPLIST_FILE: true

schemes:
  ClipKeeper:
    build:
      targets:
        ClipKeeper: all
        ClipKeeperTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClipKeeperTests
    archive:
      config: Release
