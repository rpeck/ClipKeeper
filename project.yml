name: ClipKeeper
options:
  bundleIdPrefix: com.raymondpeck
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "26.3"

# Exact versions, kept equal to Package.swift and Package.resolved.
# See docs/BUILDING.md, "Dependency safety", before you change one.
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  Highlightr:
    url: https://github.com/raspu/Highlightr
    exactVersion: 2.3.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 1.15.0   # 1.16 adds #Preview macros, which the Command Line Tools cannot expand
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
  SwiftNIO:
    url: https://github.com/apple/swift-nio
    exactVersion: 2.103.0
  SwiftNIOSSL:
    url: https://github.com/apple/swift-nio-ssl
    exactVersion: 2.37.5
  SwiftCertificates:
    url: https://github.com/apple/swift-certificates
    exactVersion: 1.21.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Manual
    # A stable identity keeps the Accessibility permission across rebuilds.
    # scripts/make-dev-cert.sh creates this one. Use "-" for ad-hoc signing,
    # or "Apple Development" with a DEVELOPMENT_TEAM for a real certificate.
    CODE_SIGN_IDENTITY: "ClipKeeper Development"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: false
    DEAD_CODE_STRIPPING: true

targets:
  ClipKeeper:
    type: application
    platform: macOS
    sources:
      - path: ClipKeeper
        excludes:
          - "Info.plist"
      - path: docs/USER-GUIDE.md
        buildPhase: resources
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: Highlightr
        product: Highlightr
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: GRDB
        product: GRDB
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftNIO
        product: NIOHTTP1
      - package: SwiftNIOSSL
        product: NIOSSL
      - package: SwiftCertificates
        product: X509
    info:
      path: ClipKeeper/Info.plist
      properties:
        CFBundleName: ClipKeeper
        CFBundleDisplayName: ClipKeeper
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Copyright © 2026 Raymond Peck.
        NSLocalNetworkUsageDescription: ClipKeeper sends clips to and receives clips from your phones on the local network, when you turn on phone transfer.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLName: com.raymondpeck.ClipKeeper
            CFBundleURLSchemes: [clipkeeper]
        NSServices:
          - NSMenuItem:
              default: Add to ClipKeeper
            NSMessage: addToClipKeeper
            NSPortName: ClipKeeper
            NSSendFileTypes: [public.item]
            NSRequiredContext: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raymondpeck.ClipKeeper
        PRODUCT_NAME: ClipKeeper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ClipKeeper/Info.plist

  ClipKeeperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClipKeeperTests
    dependencies:
      - target: ClipKeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raymondpeck.ClipKeeperTests
        GENERATE_INFOPLIST_FILE: true

schemes:
  ClipKeeper:
    build:
      targets:
        ClipKeeper: all
        ClipKeeperTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClipKeeperTests
    archive:
      config: Release
